version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release so that a compromised or
    # yanked version is more likely to be caught upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release so that a compromised or
    # yanked version is more likely to be caught upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
